tags:
  - name: Autenticação
    description: Login na aplicação

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Efetuar login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: joao@empresa.pt
                password:
                  type: string
                  example: joao123
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      nome:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum: [Admin, Tecnico, Rececionista]
        '401':
          description: Credenciais inválidas
        '403':
          description: Conta desativada
