tags:
  - name: Utilizadores
    description: Gestão de utilizadores (apenas Admin)

paths:
  /users:
    get:
      tags: [Utilizadores]
      summary: Listar todos os utilizadores
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de utilizadores
        '401':
          description: Não autenticado
        '403':
          description: Permissão negada
    post:
      tags: [Utilizadores]
      summary: Criar utilizador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, password, role]
              properties:
                nome:
                  type: string
                  example: Maria Santos
                email:
                  type: string
                  format: email
                  example: maria@empresa.pt
                password:
                  type: string
                  minLength: 6
                  example: maria123
                role:
                  type: string
                  enum: [Admin, Tecnico, Rececionista]
      responses:
        '201':
          description: Utilizador criado
        '409':
          description: Email já em uso

  /users/{id}:
    get:
      tags: [Utilizadores]
      summary: Obter utilizador por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dados do utilizador
        '404':
          description: Não encontrado
    put:
      tags: [Utilizadores]
      summary: Editar utilizador
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                role:
                  type: string
                  enum: [Admin, Tecnico, Rececionista]
                ativo:
                  type: boolean
      responses:
        '200':
          description: Utilizador atualizado
        '404':
          description: Não encontrado
    delete:
      tags: [Utilizadores]
      summary: Desativar utilizador
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Utilizador desativado
        '404':
          description: Não encontrado
