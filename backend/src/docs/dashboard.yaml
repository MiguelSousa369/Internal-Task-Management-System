tags:
  - name: Dashboard
    description: Indicadores e estatísticas (apenas Admin)

paths:
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Indicadores principais
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contadores gerais
          content:
            application/json:
              schema:
                type: object
                properties:
                  abertas:
                    type: integer
                    description: Tarefas Novo + EmTratamento
                  urgentes:
                    type: integer
                    description: Tarefas urgentes por resolver
                  semResponsavel:
                    type: integer
                    description: Tarefas sem técnico atribuído
                  emTratamento:
                    type: integer
                    description: Tarefas com técnico responsável
                  concluidasHoje:
                    type: integer
                    description: Tarefas concluídas no dia de hoje
        '403':
          description: Permissão negada

  /stats:
    get:
      tags: [Dashboard]
      summary: Estatísticas de produtividade por técnico
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ranking de tarefas concluídas por técnico
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tecnico:
                      type: string
                    concluidasHoje:
                      type: integer
                    concluidasMes:
                      type: integer
        '403':
          description: Permissão negada
